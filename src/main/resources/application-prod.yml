spring:
  datasource:
    #url: jdbc:mysql://task-database.c3ecoqkc8d6r.ap-northeast-2.rds.amazonaws.com:3306/test
    #username: admin
    #password: '12345678'
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  #config:
    import: "aws-parameterstore:/camp-health-app/prod/"

management:
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    message: ${APP_MESSAGE}

logging:
  level:
    root: INFO